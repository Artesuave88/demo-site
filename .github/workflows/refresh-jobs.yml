name: Refresh job listings

on:
  schedule:
    # Run once a day at 5:17 AM UK time, including GMT/BST changes.
    - cron: '17 5 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-job-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape current vacancies
        run: npm run scrape:jobs

      - name: Validate the snapshot
        run: |
          node --input-type=module <<'EOF'
          import snapshot from './src/lib/jobs.json' with { type: 'json' };

          if (!Array.isArray(snapshot.jobs) || snapshot.jobs.length < 25) {
            throw new Error(`Refusing to publish a suspicious snapshot with ${snapshot.jobs?.length ?? 0} jobs`);
          }

          if (!Array.isArray(snapshot.sources) || snapshot.sources.length < 2) {
            throw new Error(`Refusing to publish a partial snapshot with ${snapshot.sources?.length ?? 0} sources`);
          }

          console.log(`Validated ${snapshot.jobs.length} jobs from ${snapshot.sources.length} sources`);
          EOF

      - name: Verify the production build
        run: npm run build

      - name: Commit updated listings
        run: |
          if git diff --quiet -- src/lib/jobs.json; then
            echo "Job listings are already current."
            exit 0
          fi

          git config user.name "socialworkjobs.uk bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/jobs.json
          git commit -m "chore: refresh job listings"
          git push
